<!DOCTYPE html>
<html lang="en">
  <!--
    CHANGES (spotify-redesign):
    - Real title and description instead of the create-react-app defaults
      ("React App" / "Web site created using create-react-app").
    - theme-color matches the dark UI, so mobile browser chrome blends in.
    - Loads the Figtree font (a free look-alike of Spotify's Circular).
    - Removed the boilerplate create-react-app comments.
  -->
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#121212" />
    <meta name="description" content="A Spotify-style web player built on the Spotify Web Playback SDK." />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <title>Real Web Player</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
